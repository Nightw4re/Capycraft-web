<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Microsoft sign-in | Capycraft</title>
  <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%favicon.png">
</head>
<body>
  <p id="status">Finishing Microsoft sign-in…</p>
  <script type="module">
    import { broadcastResponseToMainFrame } from '@azure/msal-browser/redirect-bridge';

    broadcastResponseToMainFrame().catch(() => {
      document.getElementById('status').textContent = 'Sign-in could not be completed. Return to Capycraft and try again.';
    });
  </script>
</body>
</html>
