<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capycraft</title>
  <style>
    html {
      background: #121331;
    }

    body {
      margin: 0;
    }

    .scene {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }

    .scene img {
      position: absolute;
      display: block;
    }

    .backdrop {
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .island {
      bottom: 0;
      height: auto;
    }

    .garden {
      z-index: 1;
      right: 0;
      width: min(128%, 227svh);
      clip-path: inset(58% 0 0 58%);
    }

    .capybara {
      z-index: 2;
      left: 0;
      width: min(162%, 288svh);
      clip-path: inset(58% 61% 0 0);
    }
  </style>
</head>
<body>
  <main class="scene" role="img" aria-label="Zimní svět Capycraftu s draky nad jezerem, kapybarou a zářící zahradou">
    <img class="backdrop" src="assets/dragon-battle-background.png" alt="">
    <img class="island garden" src="assets/capybara-snow-islands.png" alt="">
    <img class="island capybara" src="assets/capybara-snow-islands.png" alt="">
  </main>
</body>
</html>
